<!-- Del-række og afsenderkort. Indsættes som en Custom HTML-blok
     nederst i venstre kolonne — efter brødteksten, før den store
     "Har du brug for hjælp?"-række. -->
<div class="fb-share">
	<span>Del</span>
	<a class="fb-sh" data-share="li" href="https://www.linkedin.com/company/finalfilmdk/" target="_blank" rel="noopener" aria-label="Del på LinkedIn">
		<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.03-3.07-1.9-3.07-1.9 0-2.2 1.46-2.2 2.97V21H9z"/></svg>
	</a>
	<a class="fb-sh" data-share="fb" href="https://www.facebook.com/FinalFilmDK" target="_blank" rel="noopener" aria-label="Del på Facebook">
		<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.87.24-1.46 1.5-1.46h1.6V4a21 21 0 0 0-2.34-.12c-2.32 0-3.9 1.42-3.9 4.02V10H7.5v3h2.86v8z"/></svg>
	</a>
	<a class="fb-sh" data-share="copy" href="#" aria-label="Kopiér link">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10.1 13.9a3.9 3.9 0 0 0 5.6 0l2.9-2.9a3.9 3.9 0 0 0-5.6-5.6l-1.5 1.5"/><path d="M13.9 10.1a3.9 3.9 0 0 0-5.6 0l-2.9 2.9a3.9 3.9 0 0 0 5.6 5.6l1.5-1.5"/></svg>
	</a>
</div>

<div class="fb-author">
	<span class="fb-av"></span>
	<div>
		<h3 class="fb-author-t">Skrevet af Final Film</h3>
		<span class="fb-author-role">Filmproduktion · Aalborg</span>
		<p>Vi laver film for virksomheder i hele Danmark — fra den første idé til den færdige film. Skal vi tage en snak om jeres næste?</p>
		<div class="fb-author-acts">
			<a class="fb-chip" href="https://final.dk/produktioner/">Se vores produktioner</a>
			<a class="fb-chip" href="https://final.dk/kontakt/">Skriv til os</a>
		</div>
	</div>
</div>

<script>
/* Bygger de tre delelinks ud fra sidens egen adresse, så blokken kan
   genbruges uændret på alle indlæg. Uden JavaScript peger de to første
   links på jeres profiler — ikke i stykker, bare mindre nyttige. */
(function () {
	var box = document.querySelector('.fb-share');
	if (!box) { return; }
	var u = encodeURIComponent(window.location.href);
	Array.prototype.forEach.call(box.querySelectorAll('[data-share]'), function (a) {
		var t = a.getAttribute('data-share');
		if (t === 'li') { a.href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + u; }
		if (t === 'fb') { a.href = 'https://www.facebook.com/sharer/sharer.php?u=' + u; }
		if (t === 'copy') {
			a.addEventListener('click', function (e) {
				e.preventDefault();
				if (navigator.clipboard) { navigator.clipboard.writeText(window.location.href); }
				a.setAttribute('aria-label', 'Link kopieret');
			});
		}
	});
})();
</script>
